controller:
  service:
    type: NodePort

    nodePorts:
      http: 30080
      https: 30443
  
  replicaCount: 2

  nodeSelector:
    node-role.kubernetes.io/worker: ""
  
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller