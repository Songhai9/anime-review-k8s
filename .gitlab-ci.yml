stages:
  - update
  - deploy

variables:
  AWS_REGION: "eu-north-1"
  AWS_DEFAULT_REGION: "eu-north-1"
  K8S_TRANSFER_BUCKET: "songhai9-anime-review-ansible-ssm-0909-eu-north-1"
  BOOTSTRAP_CLUSTER: "false"

update_manifests:
  stage: update

  image:
    name: mikefarah/yq:4
    entrypoint: [""]
    docker:
      user: "0"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'

  before_script:
    - apk add --no-cache git

  script:
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@anime-review.local"

    - |
      yq -i \
        '.spec.template.spec.containers[0].image = strenv(FRONTEND_IMAGE)' \
        frontend/frontend-deployment.yaml

    - |
      yq -i \
        '.spec.template.spec.containers[0].image = strenv(BACKEND_IMAGE)' \
        backend/backend-deployment.yaml

    - git diff
    - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env
    - |
      if git diff --quiet; then
        echo "Manifests already use $IMAGE_TAG"
        exit 0
      fi

    - git add frontend/frontend-deployment.yaml backend/backend-deployment.yaml
    - git commit -m "CI/CD - update manifests for $IMAGE_TAG"

    - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env

    - |
      git remote set-url origin \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

    - git push origin HEAD:main

  artifacts:
    reports:
      dotenv: deploy.env


deploy_cluster:
  stage: deploy

  needs:
    - job: update_manifests
      artifacts: true
      optional: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    entrypoint: [""]

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  
  resource_group: anime-review-cluster

  before_script:
    - apt-get update
    - apt-get install -y git

  script:
    - |
      aws_sts_output=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)

    - aws sts get-caller-identity

    - |
      CONTROL_PLANE_INSTANCE_ID=$(aws ec2 describe-instances \
        --filters \
          "Name=tag:Name,Values=anime-review-control-plane" \
          "Name=instance-state-name,Values=running" \
        --query 'Reservations[0].Instances[0].InstanceId' \
        --output text)

      echo "Control plane instance - $CONTROL_PLANE_INSTANCE_ID"

    - DEPLOY_SHA="${DEPLOY_SHA:-$CI_COMMIT_SHA}"
    - echo "Deploy SHA - $DEPLOY_SHA"

    - git fetch origin main
    - git checkout --detach "$DEPLOY_SHA"

    - |
      BACKEND_B64=$(base64 -w0 backend/backend-deployment.yaml)
      FRONTEND_B64=$(base64 -w0 frontend/frontend-deployment.yaml)

      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters "{\"commands\":[
          \"set -e\",
          \"echo '$BACKEND_B64' | base64 -d > /tmp/backend-deployment.yaml\",
          \"/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/backend-deployment.yaml\",
          \"/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/backend-deployment -n anime-review --timeout=180s\",
          \"echo '$FRONTEND_B64' | base64 -d > /tmp/frontend-deployment.yaml\",
          \"/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/frontend-deployment.yaml\",
          \"/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf rollout status deployment/frontend-deployment -n anime-review --timeout=180s\"
        ]}" \
        --query 'Command.CommandId' \
        --output text)

      echo "Deploy command - $COMMAND_ID"

      WAIT_FAILED=0

      aws ssm wait command-executed \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID" || WAIT_FAILED=1

      aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
        --query '{
          Status:Status,
          ExitCode:ResponseCode,
          Stdout:StandardOutputContent,
          Stderr:StandardErrorContent
        }'

      exit "$WAIT_FAILED"

bootstrap_cluster:
  stage: deploy

  resource_group: anime-review-cluster

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BOOTSTRAP_CLUSTER == "true"'

  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    entrypoint: [""]

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  before_script:
    - apt-get update
    - apt-get install -y jq

  script:
    - |
      aws_sts_output=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export $(printf \
        "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
        $aws_sts_output)

    - aws sts get-caller-identity

    - |
      CONTROL_PLANE_INSTANCE_ID=$(aws ec2 describe-instances \
        --filters \
          "Name=tag:Name,Values=anime-review-control-plane" \
          "Name=instance-state-name,Values=running" \
        --query 'Reservations[0].Instances[0].InstanceId' \
        --output text)

      test "$CONTROL_PLANE_INSTANCE_ID" != "None"

      echo "Control plane: $CONTROL_PLANE_INSTANCE_ID"

    - |
      set -eu

      ARTIFACT="/tmp/anime-review-k8s-${CI_COMMIT_SHA}.tar.gz"
      S3_KEY="k8s-bootstrap/${CI_PIPELINE_ID}/${CI_COMMIT_SHA}.tar.gz"

      echo "Creating bootstrap artifact for $CI_COMMIT_SHA"

      tar \
        --exclude=.git \
        -czf "$ARTIFACT" \
        .

      echo "Uploading bootstrap artifact"

      aws s3 cp \
        "$ARTIFACT" \
        "s3://${K8S_TRANSFER_BUCKET}/${S3_KEY}" \
        --region "$AWS_REGION"

      cleanup() {
        echo "Cleaning bootstrap artifact"

        aws s3 rm \
          "s3://${K8S_TRANSFER_BUCKET}/${S3_KEY}" \
          --region "$AWS_REGION" \
          || true
      }

      trap cleanup EXIT

      PARAMETERS=$(jq -n \
        --arg bucket "$K8S_TRANSFER_BUCKET" \
        --arg key "$S3_KEY" \
        --arg region "$AWS_REGION" \
        '{
          commands: [
            "set -e",
            "rm -rf /opt/anime-review-k8s /tmp/anime-review-k8s.tar.gz",
            "mkdir -p /opt/anime-review-k8s",
            (
              "/usr/local/bin/aws s3 cp s3://" +
              $bucket + "/" + $key +
              " /tmp/anime-review-k8s.tar.gz --region " +
              $region
            ),
            "tar -xzf /tmp/anime-review-k8s.tar.gz -C /opt/anime-review-k8s",
            "chmod +x /opt/anime-review-k8s/bootstrap-cluster.sh /opt/anime-review-k8s/install_addons.sh",
            (
              "cd /opt/anime-review-k8s && AWS_REGION=" +
              $region +
              " ./bootstrap-cluster.sh"
            ),
            "rm -f /tmp/anime-review-k8s.tar.gz"
          ]
        }')

      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters "$PARAMETERS" \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM command: $COMMAND_ID"

      for attempt in $(seq 1 120); do
        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
          --query 'Status' \
          --output text)

        echo "SSM status: $STATUS"

        case "$STATUS" in
          Success)
            break
            ;;
          Failed|Cancelled|TimedOut|Cancelling)
            break
            ;;
        esac

        sleep 10
      done

      RESULT=$(aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
        --query '{
          Status:Status,
          ExitCode:ResponseCode,
          Stdout:StandardOutputContent,
          Stderr:StandardErrorContent
        }')

      echo "$RESULT"

      STATUS=$(echo "$RESULT" | jq -r '.Status')

      if [ "$STATUS" != "Success" ]; then
        echo "Cluster bootstrap failed with status: $STATUS"
        exit 1
      fi