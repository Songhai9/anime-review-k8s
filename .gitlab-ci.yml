stages:
  - update
  - deploy

variables:
  AWS_REGION: "eu-north-1"
  AWS_DEFAULT_REGION: "eu-north-1"
  K8S_TRANSFER_BUCKET: "songhai9-anime-review-ansible-ssm-0909-eu-north-1"
  BOOTSTRAP_CLUSTER: "false"

update_manifests:
  stage: update

  image:
    name: mikefarah/yq:4
    entrypoint: [""]
    docker:
      user: "0"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'

  before_script:
    - apk add --no-cache git

  script:
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@anime-review.local"

    - |
      yq -i \
        '.backend.image.tag = strenv(IMAGE_TAG)' \
        charts/anime-review/values.yaml

    - |
      yq -i \
        '.frontend.image.tag = strenv(IMAGE_TAG)' \
        charts/anime-review/values.yaml

    - git diff

    # Important : le dotenv doit exister même s'il n'y a aucun diff.
    - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env

    - |
      if git diff --quiet; then
        echo "Helm values already use image tag $IMAGE_TAG"
        exit 0
      fi

    - git add charts/anime-review/values.yaml
    - git commit -m "CI/CD - update Helm values for $IMAGE_TAG"

    - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env

    - |
      git remote set-url origin \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

    - git push origin HEAD:main

  artifacts:
    reports:
      dotenv: deploy.env


deploy_cluster:
  stage: deploy

  resource_group: anime-review-cluster

  needs:
    - job: update_manifests
      artifacts: true
      optional: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    entrypoint: [""]

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  variables:
    AWS_REGION: "eu-north-1"
    AWS_DEFAULT_REGION: "eu-north-1"
    K8S_TRANSFER_BUCKET: "songhai9-anime-review-ansible-ssm-0909-eu-north-1"

  before_script:
    - apt-get update
    - apt-get install -y git jq

  script:
    - |
      set -euo pipefail

      echo "==> Assuming Kubernetes CD role"

      aws_sts_output=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export $(printf \
        "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" \
        $aws_sts_output)

      aws sts get-caller-identity

      echo "==> Discovering control plane"

      CONTROL_PLANE_INSTANCE_ID=$(aws ec2 describe-instances \
        --filters \
          "Name=tag:Name,Values=anime-review-control-plane" \
          "Name=instance-state-name,Values=running" \
        --query 'Reservations[0].Instances[0].InstanceId' \
        --output text)

      if [ -z "$CONTROL_PLANE_INSTANCE_ID" ] || \
         [ "$CONTROL_PLANE_INSTANCE_ID" = "None" ]; then
        echo "Unable to find running Kubernetes control plane"
        exit 1
      fi

      echo "Control plane: $CONTROL_PLANE_INSTANCE_ID"

      DEPLOY_SHA="${DEPLOY_SHA:-$CI_COMMIT_SHA}"

      echo "Deploy SHA: $DEPLOY_SHA"

      echo "==> Checking out exact desired state"

      git fetch origin main
      git checkout --detach "$DEPLOY_SHA"

      echo "==> Packaging Helm chart"

      ARCHIVE="/tmp/anime-review-chart-${DEPLOY_SHA}.tar.gz"
      S3_KEY="k8s-bootstrap/helm/${CI_PIPELINE_ID}/${DEPLOY_SHA}.tar.gz"

      tar \
        -czf "$ARCHIVE" \
        -C charts \
        anime-review

      echo "==> Uploading temporary Helm artifact"

      aws s3 cp \
        "$ARCHIVE" \
        "s3://${K8S_TRANSFER_BUCKET}/${S3_KEY}"

      cleanup() {
        echo "==> Cleaning temporary S3 artifact"

        aws s3 rm \
          "s3://${K8S_TRANSFER_BUCKET}/${S3_KEY}" \
          >/dev/null 2>&1 || true
      }

      trap cleanup EXIT

      echo "==> Preparing remote Helm deployment"

      REMOTE_SCRIPT=$(cat <<EOF
      set -euo pipefail

      export KUBECONFIG=/etc/kubernetes/admin.conf
      export PATH=/usr/local/bin:/usr/bin:/bin:\$PATH

      DEPLOY_DIR="/tmp/anime-review-helm-${DEPLOY_SHA}"
      ARCHIVE="/tmp/anime-review-chart-${DEPLOY_SHA}.tar.gz"

      rm -rf "\$DEPLOY_DIR"
      mkdir -p "\$DEPLOY_DIR"

      echo "Downloading Helm chart"

      /usr/local/bin/aws s3 cp \
        "s3://${K8S_TRANSFER_BUCKET}/${S3_KEY}" \
        "\$ARCHIVE" \
        --region "${AWS_REGION}"

      echo "Extracting Helm chart"

      tar -xzf "\$ARCHIVE" \
        -C "\$DEPLOY_DIR"

      echo "Linting Helm chart"

      /usr/local/bin/helm lint \
        "\$DEPLOY_DIR/anime-review"

      echo "Deploying Helm release"

      /usr/local/bin/helm upgrade --install anime-review \
        "\$DEPLOY_DIR/anime-review" \
        --namespace anime-review \
        --server-side=true \
        --wait \
        --rollback-on-failure \
        --timeout 5m

      echo "Helm release status"

      /usr/local/bin/helm status anime-review \
        --namespace anime-review

      rm -rf "\$DEPLOY_DIR"
      rm -f "\$ARCHIVE"
      EOF
      )

      REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)

      echo "==> Starting deployment through SSM"

      PARAMETERS=$(jq -n \
        --arg command "echo '$REMOTE_SCRIPT_B64' | base64 -d | bash" \
        '{commands: [$command]}')

      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters "$PARAMETERS" \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM command: $COMMAND_ID"

      echo "==> Waiting for Helm deployment"

      for attempt in $(seq 1 90); do

        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
          --query 'Status' \
          --output text \
          2>/dev/null || echo "Pending")

        echo "SSM status: $STATUS"

        case "$STATUS" in
          Success)
            break
            ;;

          Failed|Cancelled|TimedOut|Cancelling)
            echo "Deployment failed"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
              --query '{
                Status:Status,
                ExitCode:ResponseCode,
                Stdout:StandardOutputContent,
                Stderr:StandardErrorContent
              }'

            exit 1
            ;;
        esac

        if [ "$attempt" -eq 90 ]; then
          echo "Timed out waiting for deployment"
          exit 1
        fi

        sleep 5
      done

      echo "==> Deployment output"

      aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
        --query '{
          Status:Status,
          ExitCode:ResponseCode,
          Stdout:StandardOutputContent,
          Stderr:StandardErrorContent
        }'

      echo "==> Helm deployment completed successfully"