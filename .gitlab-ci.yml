stages:
  - update
  - deploy

update_manifests:
  stage: update

  image:
    name: mikefarah/yq:4
    entrypoint: [""]
    docker:
      user: "0"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'

  before_script:
    - apk add --no-cache git

  script:
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@anime-review.local"

    - |
      yq -i \
        '.spec.template.spec.containers[0].image = strenv(FRONTEND_IMAGE)' \
        frontend/frontend-deployment.yaml

    - |
      yq -i \
        '.spec.template.spec.containers[0].image = strenv(BACKEND_IMAGE)' \
        backend/backend-deployment.yaml

    - git diff
    - - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env
    - |
      if git diff --quiet; then
        echo "Manifests already use $IMAGE_TAG"
        exit 0
      fi

    - git add frontend/frontend-deployment.yaml backend/backend-deployment.yaml
    - git commit -m "CI/CD - update manifests for $IMAGE_TAG"

    - echo "DEPLOY_SHA=$(git rev-parse HEAD)" > deploy.env

    - |
      git remote set-url origin \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

    - git push origin HEAD:main

  artifacts:
    reports:
      dotenv: deploy.env


deploy_cluster:
  stage: deploy

  needs:
    - job: update_manifests
      artifacts: true

  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $IMAGE_TAG'

  image:
    name: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
    entrypoint: [""]

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com

  variables:
    AWS_REGION: "eu-north-1"
    AWS_DEFAULT_REGION: "eu-north-1"

  before_script:
    - apt-get update
    - apt-get install -y git

  script:
    - |
      aws_sts_output=$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

    - export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)

    - aws sts get-caller-identity

    - |
      CONTROL_PLANE_INSTANCE_ID=$(aws ec2 describe-instances \
        --filters \
          "Name=tag:Name,Values=anime-review-control-plane" \
          "Name=instance-state-name,Values=running" \
        --query 'Reservations[0].Instances[0].InstanceId' \
        --output text)

      echo "Control plane instance - $CONTROL_PLANE_INSTANCE_ID"

    - echo "Deploy SHA - $DEPLOY_SHA"

    - git fetch origin main
    - git checkout --detach "$DEPLOY_SHA"

    - |
      COMMAND_ID=$(aws ssm send-command \
        --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters 'commands=["/usr/bin/kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes"]' \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM command - $COMMAND_ID"

      aws ssm wait command-executed \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID"

      aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "$CONTROL_PLANE_INSTANCE_ID" \
        --query '{
          Status:Status,
          ExitCode:ResponseCode,
          Stdout:StandardOutputContent,
          Stderr:StandardErrorContent
        }'
    
    - |
      BACKEND_B64=$(base64 -w 0 backend/backend-deployment.yaml)
      aws ssm send-command \
        --instance-ids "$CONTROL_PLANE_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters 'commands=["echo $BACKEND_B64 | base64 -d > /tmp/backend-deployment.yaml", "/usr/bin/kubectl --dry-run=server --kubeconfig /etc/kubernetes/admin.conf apply -f /tmp/backend-deployment.yaml"]'
